# Free internship demo: database expires after 30 days; uploaded files are temporary.
services:
  - type: web
    name: nikelomoyo-everyday-store
    runtime: python
    region: frankfurt
    plan: free
    repo: https://github.com/Nikelomoyo/NikeloMoyosEcommerceStore.git
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_SETTINGS_MODULE
        value: config.production
      - key: DJANGO_DEBUG
        value: '0'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nikelomoyo-everyday-db
          property: connectionString
      - key: DJANGO_MEDIA_ROOT
        value: /tmp/everyday-media

databases:
  - name: nikelomoyo-everyday-db
    region: frankfurt
    plan: free
    databaseName: everyday
    user: everyday
    ipAllowList: []